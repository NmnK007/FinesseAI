services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: finnese
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local database password in .env}
      POSTGRES_DB: finnese
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - finnese_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finnese -d finnese"]
      interval: 5s
      timeout: 3s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    environment:
      MP_MAX_MESSAGES: 100
volumes:
  finnese_postgres:
